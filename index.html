<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ตึก สบท 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas, floating control sheet top-left (bottom sheet on phones) */
:root{
  --bg:#dfe9ec; --panel:rgba(250,252,252,.92); --fg:#17262b; --muted:#5b6d73;
  --accent:#2f8f95; --accent-ink:#ffffff; --line:rgba(23,38,43,.12);
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11191c;--panel:rgba(20,30,34,.9);--fg:#e4eef0;--muted:#93a7ad;--accent:#5cc2c8;--accent-ink:#0d1a1c;--line:rgba(228,238,240,.14);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11191c;--panel:rgba(20,30,34,.9);--fg:#e4eef0;--muted:#93a7ad;--accent:#5cc2c8;--accent-ink:#0d1a1c;--line:rgba(228,238,240,.14);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.sheet{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:300px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px}
h1{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rooms{font-size:12px;line-height:1.5;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.rooms span:nth-child(odd){font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:8px}
.tag{position:absolute;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--panel);color:var(--fg);border:1px solid var(--line);white-space:nowrap;pointer-events:none}
#tog{flex:none;min-width:40px;min-height:36px;font-size:18px;line-height:1;padding:4px 10px}
.sheet.min .body,.sheet.min .sub{display:none!important}
.sheet.min h1{font-size:14px}
.sheet.min{padding:8px 10px}
.sheet.min{width:auto;max-width:300px}
@media (max-width:640px){
  .sheet{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:46%}
  .sheet.min{right:auto}
}
.render .sheet{display:none}.render .tag{font-size:13px;font-weight:500}
#load{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}
</style>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="load">กำลังสร้างโมเดล…</div>
<div class="sheet" id="sheet">
  <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
    <div><h1>อาคารสำนักบริหารจัดการทรัพย์สินฯ</h1>
    <div class="sub">มรภ.ภูเก็ต · 4 ชั้น + ดาดฟ้า · 50 × 15.5 ม. · สร้างจากแปลนปี 2544</div></div>
    <button id="tog" aria-label="ย่อ/ขยายเมนู">–</button>
  </div>
  <div class="body" style="display:flex;flex-direction:column;gap:12px">
    <div><div class="lbl">มุมมอง</div><div class="row" id="views"></div></div>
    <div><div class="lbl">ชั้น 1</div><div class="row"><button id="vAfter" class="on">หลังปรับปรุง</button><button id="vBefore">ก่อนปรับปรุง</button></div></div>
    <div><div class="lbl">แสดงชั้น (ตัดดูภายใน)</div><div class="row" id="floors"></div></div>
    <div><div class="lbl">รายการห้อง</div><div class="rooms" id="rooms"></div></div>
    <div class="row"><button id="pres">▶ โหมดนำเสนอ (หมุนอัตโนมัติ)</button><button id="rot">หมุนอัตโนมัติ</button><button id="fs">เต็มจอ</button></div>
    <div class="row"><button id="lb">ป้ายชื่อห้อง</button><button id="st" class="on">ภูมิทัศน์</button></div>
    <div class="note">ลากเพื่อหมุน · สองนิ้ว/ล้อเมาส์เพื่อซูม · คลิกขวาเพื่อเลื่อน<br>ความสูงชั้นสมมติ 3.5 ม. ผังห้องตามแบบเดิม ปัจจุบันอาจเปลี่ยนแปลง</div>
  </div>
</div>

  mesh.castShadow = !isGlass && M.groups[+gi] !== 'Site' || ['leaf','trunk','metal'].includes(M.matorder[+mi]);
  mesh.receiveShadow = true;
  if (M.matorder[+mi]==='grass' || M.matorder[+mi]==='road' || M.matorder[+mi]==='paving') mesh.castShadow = false;
  groups[M.groups[+gi]].add(mesh);
}
document.getElementById('load').remove();

const camera = new THREE.PerspectiveCamera(40, 1, .1, 800);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*.495; controls.minDistance = 4; controls.maxDistance = 220;
const VIEWS = {
  front:  {n:'ด้านหน้า (ฝั่งถนน)', p:[25, 9, -56], t:[25, 6, 6]},
  se:     {n:'มุมหน้า-ขวา', p:[-28, 22, -40], t:[25, 6, 6]},
  sw:     {n:'มุมหน้า-ซ้าย', p:[80, 18, -34], t:[25, 6, 6]},
  back:   {n:'ด้านหลัง', p:[25, 14, 66], t:[25, 6, 8]},
  ne:     {n:'มุมหลัง', p:[78, 26, 50], t:[25, 6, 8]},
  aerial: {n:'มุมสูง', p:[-6, 48, -36], t:[25, 2, 6]},
  top:    {n:'มองจากบน', p:[25, 110, 8.01], t:[25, 0, 8]},
  core:   {n:'ซูมบันได+ลิฟต์กลาง', p:[36, 14, -9], t:[26.5, 0, 4]},
  west:   {n:'ซูมบันไดฝั่งตะวันตก', p:[11, 10, -7], t:[2, 0, 2.5]},
  kit:    {n:'ซูมครัวกลาง', p:[44, 13, 4], t:[45.5, 0, 16]},
  ware:   {n:'ซูม Store + ศูนย์ถ่ายเอกสาร', p:[-2, 15, 33], t:[14, 0, 14]},
  shop:   {n:'ซูมโชว์รูม', p:[16, 12, -7], t:[13, 0, 3]},
  eye:    {n:'ระดับสายตา', p:[48, 1.7, -24], t:[26, 7, 4]},
};
function go(k, instant){ const V=VIEWS[k]; camera.position.set(...V.p); controls.target.set(...V.t); controls.update();
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on', b.dataset.k===k)); }
const vb = document.getElementById('views');
for (const k in VIEWS) { const b=document.createElement('button'); b.textContent=VIEWS[k].n; b.dataset.k=k; b.onclick=()=>go(k); vb.appendChild(b); }

const FL = [['all','ทั้งหลัง'],['4','ชั้น 1–4'],['3','ชั้น 1–3'],['2','ชั้น 1–2'],['1','ชั้น 1']];
let cur='all', labelsOn=false;
const fb = document.getElementById('floors');
FL.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>setFloor(k);fb.appendChild(b);});
let variant = location.hash.includes('before') ? 'before' : 'after';
function setVariant(v){ variant=v; document.getElementById('vAfter').classList.toggle('on',v==='after'); document.getElementById('vBefore').classList.toggle('on',v==='before'); setFloor(cur); }
function setFloor(k){ cur=k; const N = k==='all'?5:+k;
  for (let f=2;f<=4;f++) groups['Floor'+f].visible = f<=N;
  groups['Floor1'].visible = variant==='before'; groups['Floor1R'].visible = variant==='after'; groups['Floor1RRoof'].visible = variant==='after' && N>=2;
  groups['Roof'].visible = N===5;
  // hide the slab/shade of floor above when cutting: shades for upper floor live in next floor group, already hidden
  document.querySelectorAll('#floors button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  showRooms(); }
document.getElementById('vAfter').onclick=()=>setVariant('after');document.getElementById('vBefore').onclick=()=>setVariant('before');
const roomsEl = document.getElementById('rooms'), labelsEl = document.getElementById('labels');
let tags=[];
function showRooms(){ const f0 = cur==='all'?'1':cur; const f = (f0==='1' && variant==='after') ? '1R' : f0; roomsEl.innerHTML='';
  const head=document.createElement('span');head.textContent='ชั้น '+f0;const h2=document.createElement('span');h2.textContent=cur==='all'?'(เลือกชั้นเพื่อดูชั้นอื่น)':'';roomsEl.append(head,h2);
  const seen=new Set();
  (M.rooms[f]||[]).forEach(r=>{ if(seen.has(r[0])||!r[0]) return; seen.add(r[0]); const a=document.createElement('span');a.textContent=r[5]==='circ'||r[5]==='walk'?'·':((r[3]-r[1])*(r[4]-r[2])).toFixed(0)+' ม²';const b=document.createElement('span');b.textContent=r[0];roomsEl.append(a,b);});
  labelsEl.innerHTML=''; tags=[]; const seenL=new Set();
  if(!labelsOn) return;
  (M.rooms[f]||[]).forEach(r=>{ if(['circ','walk'].includes(r[5])||seenL.has(r[0])) return; seenL.add(r[0]); const d=document.createElement('div');d.className='tag';d.textContent=r[0];labelsEl.appendChild(d);
    tags.push([d,new THREE.Vector3((r[1]+r[3])/2,(+f0-1)*3.5+1.2,(r[2]+r[4])/2)]); });
}
document.getElementById('lb').onclick=e=>{labelsOn=!labelsOn;e.target.classList.toggle('on',labelsOn);showRooms();};
document.getElementById('st').onclick=e=>{groups.Site.visible=!groups.Site.visible;e.target.classList.toggle('on',groups.Site.visible);};
const rotB=document.getElementById('rot');
rotB.onclick=()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=0.8;rotB.classList.toggle('on',controls.autoRotate);};
document.getElementById('fs').onclick=()=>{try{document.documentElement.requestFullscreen?.().catch(()=>{});}catch(e){}};
const sheetEl=document.getElementById('sheet');
const exitB=document.createElement('button');exitB.textContent='✕ ออกจากโหมดนำเสนอ';exitB.hidden=true;
Object.assign(exitB.style,{position:'fixed',right:'max(16px, env(safe-area-inset-right,0px))',bottom:'calc(16px + env(safe-area-inset-bottom,0px))',background:'var(--panel)'});document.body.appendChild(exitB);
const tour=['se','front','sw','back','aerial'];let ti=0,tourT=null;
document.getElementById('pres').onclick=()=>{sheetEl.hidden=true;exitB.hidden=false;controls.autoRotate=true;controls.autoRotateSpeed=0.8;rotB.classList.add('on');go('aerial');try{document.documentElement.requestFullscreen?.().catch(()=>{});}catch(e){}};
exitB.onclick=()=>{sheetEl.hidden=false;exitB.hidden=true;controls.autoRotate=false;rotB.classList.remove('on');try{document.fullscreenElement&&document.exitFullscreen();}catch(e){}};
document.getElementById('tog').onclick=e=>{const s=document.getElementById('sheet');s.classList.toggle('min');e.currentTarget.textContent=s.classList.contains('min')?'☰':'–';};

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const hv = location.hash.replace('#render-','').split('-');
setFloor(RENDER && hv[1] ? hv[1] : 'all'); go(RENDER && VIEWS[hv[0]] ? hv[0] : 'se');
if (RENDER && hv[2]==='lb'){labelsOn=true;showRooms();}
function placeTags(){ const w=innerWidth,h=innerHeight; for(const [d,p] of tags){const q=p.clone().project(camera);
    d.style.display=q.z<1?'block':'none'; d.style.left=((q.x+1)/2*w - d.offsetWidth/2)+'px'; d.style.top=((1-q.y)/2*h)+'px';} }
function loop(){ controls.update(); renderer.render(scene,camera); placeTags(); requestAnimationFrame(loop); }
if (RENDER) { controls.update(); renderer.render(scene,camera); placeTags(); window.__ready = true; } else { loop(); window.__ready = true; if (innerWidth <= 640) { document.getElementById('sheet').classList.add('min'); document.getElementById('tog').textContent='☰'; } }
</script>
